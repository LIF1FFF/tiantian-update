<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090d" media="(prefers-color-scheme: dark)">
<title>天天货运记账 · 下载与更新</title>
<meta name="description" content="天天货运记账 安卓版下载与版本更新。">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --brand:#ff6a00; --brand2:#ff8a3d; --brand3:#f04e00; --brand-rgb:255,106,0;
  --text:#14161a; --text2:#5d6472; --text3:#949aa6;
  --glass:rgba(255,255,255,.62); --glass-brd:rgba(255,255,255,.82);
  --gl-inset:inset 0 1px 0 rgba(255,255,255,.96), inset 0 -1px 0 rgba(255,255,255,.34);
  --shadow:0 14px 40px rgba(22,30,48,.12), 0 2px 8px rgba(22,30,48,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --text:#f2f3f5; --text2:#a6adb8; --text3:#767d88;
    --glass:rgba(52,58,68,.58); --glass-brd:rgba(255,255,255,.13);
    --gl-inset:inset 0 1px 0 rgba(255,255,255,.15), inset 0 -1px 0 rgba(255,255,255,.05);
    --shadow:0 18px 46px rgba(0,0,0,.48), 0 2px 10px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#edf1f8}
@media (prefers-color-scheme: dark){ html{background:#07090d} }
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.55;position:relative;isolation:isolate;
  padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
}
body::before{
  content:"";position:fixed;inset:-40vh -40vw;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 30% at 22% 14%, rgba(255,150,70,.50), transparent 70%),
    radial-gradient(38% 28% at 82% 10%, rgba(126,96,255,.42), transparent 70%),
    radial-gradient(44% 32% at 76% 66%, rgba(12,158,190,.36), transparent 70%),
    radial-gradient(40% 30% at 16% 84%, rgba(240,70,130,.30), transparent 72%),
    radial-gradient(50% 40% at 50% 42%, rgba(255,255,255,.55), transparent 68%);
  filter:blur(54px);
}
@media (prefers-color-scheme: dark){
  body::before{opacity:.5;filter:blur(56px)}
}
.wrap{max-width:480px;margin:0 auto}

/* 头部 */
.hero{text-align:center;padding:10px 0 22px}
.hero img{
  width:92px;height:92px;border-radius:24px;display:block;margin:0 auto;
  box-shadow:0 16px 38px rgba(var(--brand-rgb),.34), inset 0 1px 0 rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.5);
}
.hero h1{margin:16px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;font-size:13.5px;color:var(--text2)}
.tag{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  padding:5px 13px;border-radius:99px;font-size:12.5px;font-weight:700;
  color:var(--brand);background:rgba(var(--brand-rgb),.13);
  border:1px solid rgba(var(--brand-rgb),.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
}

/* 玻璃卡 */
.card{
  position:relative;border-radius:24px;padding:20px;
  background:linear-gradient(157deg, rgba(255,255,255,.78), rgba(255,255,255,.46) 48%, rgba(255,255,255,.66));
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-brd);
  box-shadow:var(--gl-inset), var(--shadow);
  margin-bottom:14px;
}
@media (prefers-color-scheme: dark){
  .card{background:linear-gradient(157deg, rgba(64,70,81,.70), rgba(38,43,51,.54) 48%, rgba(52,58,68,.64))}
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 100% at 4% -10%, rgba(255,255,255,.55), rgba(255,255,255,0) 52%);
  opacity:.75;
}
@media (prefers-color-scheme: dark){
  .card::after{background:radial-gradient(130% 100% at 4% -10%, rgba(255,255,255,.13), rgba(255,255,255,0) 52%)}
}
.card > *{position:relative;z-index:1}

/* 下载按钮 */
.dl{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;height:60px;border-radius:20px;border:1px solid rgba(255,255,255,.28);
  background:linear-gradient(158deg, var(--brand2), var(--brand) 48%, var(--brand3));
  color:#fff;font-size:17.5px;font-weight:800;letter-spacing:.02em;
  text-decoration:none;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(0,0,0,.12),
             0 14px 30px rgba(var(--brand-rgb),.40);
  transition:transform .14s;
}
.dl:active{transform:scale(.975)}
.dl::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg, rgba(255,255,255,.42), rgba(255,255,255,0) 45%, rgba(255,255,255,0) 64%, rgba(255,255,255,.20));
}
.dl svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meta{
  display:flex;justify-content:center;gap:15px;flex-wrap:wrap;
  margin-top:12px;font-size:12px;color:var(--text3);
}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta b{font-weight:650;color:var(--text2)}

/* 更新说明 */
.card h2{
  margin:0 0 12px;font-size:14px;font-weight:800;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.card h2 em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--text3)}
.notes{margin:0;padding:0;list-style:none}
.notes li{
  position:relative;padding:9px 0 9px 22px;font-size:13.5px;color:var(--text2);
  border-top:1px solid rgba(120,128,140,.15);
}
.notes li:first-child{border-top:0;padding-top:2px}
.notes li::before{
  content:"";position:absolute;left:4px;top:16px;
  width:6px;height:6px;border-radius:50%;
  background:linear-gradient(140deg,var(--brand2),var(--brand));
  box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12);
}
.notes li:first-child::before{top:9px}

/* 软件截图 */
.shots{
  display:flex;gap:12px;justify-content:center;
  margin-top:4px;
}
.shots img{
  width:47%;max-width:190px;border-radius:18px;
  border:1px solid rgba(120,128,140,.22);
  box-shadow:0 10px 26px rgba(22,30,48,.14);
}

/* 安装步骤 */
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
.steps li{
  counter-increment:s;position:relative;padding:8px 0 8px 34px;
  font-size:13.5px;color:var(--text2);
}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:8px;
  width:23px;height:23px;border-radius:50%;
  display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;
  background:linear-gradient(150deg,var(--brand2),var(--brand));
  box-shadow:0 3px 9px rgba(var(--brand-rgb),.30), inset 0 1px 0 rgba(255,255,255,.45);
}
.steps b{color:var(--text);font-weight:700}

/* 版本历史 */
.ver-row{
  display:flex;align-items:baseline;gap:9px;padding:10px 0;
  border-top:1px solid rgba(120,128,140,.15);font-size:13px;color:var(--text2);
}
.ver-row:first-of-type{border-top:0}
.ver-row b{font-size:13.5px;font-weight:750;color:var(--text);font-variant-numeric:tabular-nums}
.ver-row .cur{
  font-size:10.5px;font-weight:800;color:var(--brand);padding:1px 7px;border-radius:99px;
  background:rgba(var(--brand-rgb),.13);border:1px solid rgba(var(--brand-rgb),.2);
}
.ver-row span:last-child{margin-left:auto;font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}

footer{
  text-align:center;font-size:11.5px;color:var(--text3);
  padding:10px 0 4px;line-height:1.9;
}
footer a{color:var(--text3);text-decoration:none}
.tip{
  font-size:12px;color:var(--text3);margin:10px 0 0;line-height:1.7;
}
.skeleton{opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="icon-192.png" alt="天天货运记账">
    <h1>天天货运记账</h1>
    <p>货拉拉 · 运满满 司机记账，净赚多少一目了然</p>
    <div class="tag" id="verTag">v1.0.2 · 安卓版</div>
  </div>

  <div class="card">
    <a class="dl" id="dlBtn" href="app.apk" download>
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 20h16"/></svg>
      <span>下载安装包</span>
    </a>
    <div class="meta">
      <span>版本 <b id="mVer">1.0.2</b></span>
      <span>大小 <b id="mSize">—</b></span>
      <span>更新 <b id="mDate">—</b></span>
    </div>
    <p class="tip">适用于 Android 6.0 及以上。若浏览器提示“未知来源”，请选择允许后继续安装。</p>
  </div>

  <div class="card">
    <h2>本次更新 <em id="noteVer"></em></h2>
    <ul class="notes" id="notes" class="skeleton"><li>正在加载更新说明…</li></ul>
  </div>

  <div class="card">
    <h2>软件截图</h2>
    <div class="shots">
      <img src="shot-1.png" alt="明细页截图" loading="lazy">
      <img src="shot-2.png" alt="统计页截图" loading="lazy">
    </div>
  </div>

  <div class="card">
    <h2>安装方法</h2>
    <ol class="steps">
      <li>点击上方按钮下载安装包</li>
      <li>在通知栏或文件管理里点开 <b>app.apk</b></li>
      <li>如提示未知来源，进入设置允许浏览器安装应用</li>
      <li>覆盖安装即可，<b>原有记账数据不会丢失</b></li>
    </ol>
  </div>

  <div class="card">
    <h2>版本历史 <em>最近发布</em></h2>
    <div id="history"><div class="ver-row skeleton">正在加载…</div></div>
  </div>

  <footer>
    © 2026 FFF. All Rights Reserved.
  </footer>
</div>

<script>
(function () {
  var FALLBACK = {
    version: '1.0.2',
    notes: ['底部导航改为 iOS 悬浮椭圆玻璃胶囊', '新增应用内检查更新与在线安装'],
    size: '—',
    publishedAt: '2026-10-20'
  };

  function fmtDate(s) {
    if (!s) return '—';
    var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[1] + '.' + m[2] + '.' + m[3]) : s;
  }

  function render(info) {
    var v = info.version || FALLBACK.version;
    document.getElementById('verTag').textContent = 'v' + v + ' · 安卓版';
    document.getElementById('mVer').textContent = v;
    document.getElementById('mSize').textContent = info.size || FALLBACK.size;
    document.getElementById('mDate').textContent = fmtDate(info.publishedAt);
    document.getElementById('noteVer').textContent = v;
    var btn = document.getElementById('dlBtn');
    if (info.url) btn.href = info.url;

    var ul = document.getElementById('notes');
    var notes = (info.notes && info.notes.length) ? info.notes : FALLBACK.notes;
    ul.innerHTML = '';
    notes.forEach(function (n) {
      var li = document.createElement('li');
      li.textContent = n;
      ul.appendChild(li);
    });
    ul.classList.remove('skeleton');
  }

  fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (info) {
      render(info);
      var hist = (info.history || []).slice(0, 5);
      if (hist.length) {
        var box = document.getElementById('history');
        box.innerHTML = '';
        hist.forEach(function (h, i) {
          var row = document.createElement('div');
          row.className = 'ver-row';
          row.innerHTML = '<b>v' + h.version + '</b>'
            + (i === 0 ? '<span class="cur">最新</span>' : '')
            + '<span>' + fmtDate(h.date) + '</span>';
          box.appendChild(row);
        });
      }
    })
    .catch(function () { render(FALLBACK); });
})();
</script>
</body>
</html>
